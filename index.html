const KEY = 'routepack-passcode';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(code) {
  const norm = code.trim().toLowerCase();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-CBC', length:256}, false, ['decrypt']);
  const out = await crypto.subtle.decrypt({name:'AES-CBC', iv:bytes(P.i)}, key, bytes(P.c));
  const text = new TextDecoder().decode(out);
  if (!text.startsWith('ROUTEPACK1')) throw new Error('bad');
  try { localStorage.setItem(KEY, norm); } catch (e) {}
  document.open(); document.write(text.slice(10)); document.close();
}
const form = document.getElementById('f'), btn = document.getElementById('b'), err = document.getElementById('err');
form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true; err.textContent = ''; btn.textContent = 'Opening...';
  try { await open_(document.getElementById('p').value); }
  catch (x) { err.textContent = window.crypto && crypto.subtle ? 'That passcode did not work.' : 'Open this page over https.'; btn.disabled = false; btn.textContent = 'Open'; }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await open_(saved); } catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} } }
})();
